[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pytaskflow"
version = "0.1.0"
description = "A PySide6 task dependency viewer/editor backed by JSON."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "pyTaskFlow contributors" }
]
dependencies = [
    "PySide6>=6.5"
]

[project.scripts]
pytaskflow = "pytaskflow.app:main"

[tool.setuptools]
package-dir = { "" = "src" }
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.md", "licenses/*.txt"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pytaskflow = ["sample_project.json", "assets/*.svg"]
